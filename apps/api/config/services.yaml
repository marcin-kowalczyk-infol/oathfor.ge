# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    apple_client_id: ''
    apple_team_id: ''
    apple_key_id: ''
    apple_private_key_path: ''
    provider_token_keyring_path: ''
    provider_token_current_key_id: ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Identity\AppleIdentityVerifier:
        arguments:
            $clientId: '%env(default:apple_client_id:APPLE_CLIENT_ID)%'

    App\Identity\CachedAppleSigningKeys:
        arguments:
            $directory: '%kernel.project_dir%/var/apple-jwks'

    # Dedicated client has no retry decorator; requests supply fixed trust/time bounds.
    apple_jwks.http_client:
        class: Symfony\Component\HttpClient\NativeHttpClient

    App\Identity\AppleJwksFetcher:
        arguments:
            $httpClient: '@apple_jwks.http_client'

    App\Identity\ProviderTokenKeyring:
        arguments:
            $path: '%env(default:provider_token_keyring_path:PROVIDER_TOKEN_KEYRING_PATH)%'
            $currentKeyId: '%env(default:provider_token_current_key_id:PROVIDER_TOKEN_CURRENT_KEY_ID)%'

    App\Identity\AppleClientSecretSigner:
        arguments:
            $clientId: '%env(default:apple_client_id:APPLE_CLIENT_ID)%'
            $teamId: '%env(default:apple_team_id:APPLE_TEAM_ID)%'
            $keyId: '%env(default:apple_key_id:APPLE_KEY_ID)%'
            $privateKeyPath: '%env(default:apple_private_key_path:APPLE_PRIVATE_KEY_PATH)%'

    # No retry decorator or logger injection for credential-bearing requests.
    apple_exchange.http_client:
        class: Symfony\Component\HttpClient\NativeHttpClient
        autoconfigure: false

    App\Identity\AppleAuthorizationExchange:
        arguments:
            $httpClient: '@apple_exchange.http_client'

    # Dedicated maintenance transport has no retry decorator or credential logger.
    apple_maintenance.http_client:
        class: Symfony\Component\HttpClient\NativeHttpClient
        autoconfigure: false

    App\Identity\AppleProviderMaintenanceClient:
        arguments:
            $httpClient: '@apple_maintenance.http_client'
